name: biometric-scores
# Computes real face-verification scores on public LFW with an open-source model (CPU).
on:
  push:
    branches: [biometric]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scores:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2" scikit-learn pillow requests tqdm
          pip install facenet-pytorch --no-deps
      - name: Compute scores
        run: |
          mkdir -p out
          python biometric/lfw_scores.py out 2>&1 | tee out/run.log
      - name: Publish
        if: always()
        run: |
          RUN="biometric-run-${{ github.run_number }}"
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          for attempt in 1 2 3 4 5 6; do
            rm -rf res
            if git ls-remote --exit-code --heads "$URL" fabric-results >/dev/null 2>&1; then
              git clone -q --depth 1 --branch fabric-results "$URL" res
            else
              mkdir res && (cd res && git init -q -b fabric-results && git remote add origin "$URL")
            fi
            mkdir -p "res/$RUN"; cp -r out/* "res/$RUN/" || true
            cd res; git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
            git add -A; git commit -q -m "Biometric scores $RUN (${{ job.status }})" || true
            if git push origin fabric-results; then break; fi
            cd ..; sleep $((attempt * 5))
          done
