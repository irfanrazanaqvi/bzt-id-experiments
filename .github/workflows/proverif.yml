name: proverif
on:
  push:
    branches: [proverif]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ProVerif
        run: |
          mkdir -p out
          (sudo add-apt-repository -y universe; sudo apt-get update; apt-cache policy proverif | head -5; sudo apt-get install -y proverif || true; which proverif || true) > out/install.log 2>&1 || true
          if ! which proverif >/dev/null; then
            echo "apt route failed; building ProVerif 2.05 from source" >> out/install.log
            (sudo apt-get install -y ocaml-nox 2>&1 | tail -2
             curl -sSL -o pv.tgz https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz && ls -la pv.tgz
             tar xzf pv.tgz && cd proverif2.05 && ./build 2>&1 | tail -5 && sudo cp proverif /usr/local/bin/ && which proverif) >> out/install.log 2>&1 || true
          fi
          tail -5 out/install.log
      - name: Verify protocol models
        run: |
          (proverif -help 2>&1 | head -2; opam list proverif 2>/dev/null | tail -1; dpkg -s proverif 2>/dev/null | grep Version) > out/proverif_version.txt || true
          python3 proverif/gen.py
          cp proverif/bztid_*.pv out/
          for v in full no_nonce no_holder_binding; do
            echo "=== $v" ; proverif proverif/bztid_$v.pv > out/result_$v.txt 2>&1 || true
            grep -E "^RESULT|Error|error" out/result_$v.txt | tee -a out/summary.txt
          done
          cat out/summary.txt
      - name: Publish
        if: always()
        run: |
          RUN="proverif-run-${{ github.run_number }}"
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          for attempt in 1 2 3 4 5 6; do
            rm -rf res
            if git ls-remote --exit-code --heads "$URL" fabric-results >/dev/null 2>&1; then git clone -q --depth 1 --branch fabric-results "$URL" res; else mkdir res && (cd res && git init -q -b fabric-results && git remote add origin "$URL"); fi
            mkdir -p "res/$RUN"; cp -r out/* "res/$RUN/" || true
            cd res; git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
            git add -A; git commit -q -m "ProVerif $RUN (${{ job.status }})" || true
            if git push origin fabric-results; then break; fi
            cd ..; sleep $((attempt * 5))
          done
