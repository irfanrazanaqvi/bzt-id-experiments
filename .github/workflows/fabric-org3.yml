name: fabric-org3

# Runs the BZT-ID chaincode on a real Hyperledger Fabric test-network and benchmarks it
# with Hyperledger Caliper. Results and logs are committed to the `fabric-results` branch.
on:
  push:
    branches: [org3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        policy: [org2and, org3and, org3of2]
        rep: [1, 2, 3]
    env:
      FABRIC_VERSION: "3.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System information
        run: |
          mkdir -p out
          { uname -a; lscpu | grep -E "Model name|^CPU\(s\)|Thread|MHz"; echo "cpus: $(nproc)"; free -m; docker version; node --version; npm --version; } > out/system.txt 2>&1 || true
          cat out/system.txt

      - name: Chaincode unit test
        run: |
          cd fabric-bench/chaincode
          npm install --no-audit --no-fund
          npm test 2>&1 | tee ../../out/chaincode_test.log
          rm -rf node_modules package-lock.json

      - name: Install Fabric binaries, images and samples
        run: |
          curl -sSLO https://raw.githubusercontent.com/hyperledger/fabric/main/scripts/install-fabric.sh
          chmod +x install-fabric.sh
          ./install-fabric.sh --fabric-version "$FABRIC_VERSION" docker samples binary 2>&1 | tee out/install.log

      - name: Configure orderer batch settings (tuned, both config files)
        run: |
          for F in fabric-samples/test-network/configtx/configtx.yaml fabric-samples/test-network/bft-config/configtx.yaml; do
            sed -i 's/BatchTimeout: 2s/BatchTimeout: 200ms/; s/MaxMessageCount: 10$/MaxMessageCount: 100/' "$F"
            echo "== $F"; grep -n "BatchTimeout\|MaxMessageCount\|RequestBatchMaxInterval\|RequestForwardTimeout" "$F"
          done 2>&1 | tee out/batch_config.txt

      - name: Start network (Raft), add Org3 if needed, deploy chaincode with the endorsement policy
        run: |
          cd fabric-samples/test-network
          export PATH="$PWD/../bin:$PATH"
          case "${{ matrix.policy }}" in
            org2and) POL="AND('Org1MSP.peer','Org2MSP.peer')" ;;
            org3and) POL="AND('Org1MSP.peer','Org2MSP.peer','Org3MSP.peer')" ;;
            org3of2) POL="OutOf(2,'Org1MSP.peer','Org2MSP.peer','Org3MSP.peer')" ;;
          esac
          echo "$POL" | tee "$GITHUB_WORKSPACE/out/policy.txt"
          ./network.sh up createChannel -c mychannel 2>&1 | tee "$GITHUB_WORKSPACE/out/network.log"
          if [ "${{ matrix.policy }}" != "org2and" ]; then
            (cd addOrg3 && ./addOrg3.sh up -c mychannel) 2>&1 | tee "$GITHUB_WORKSPACE/out/addorg3.log"
          fi
          docker ps --format '{{.Names}}' | sort | tee "$GITHUB_WORKSPACE/out/containers.txt"
          ./network.sh deployCC -ccn bzt -ccp "$GITHUB_WORKSPACE/fabric-bench/chaincode" -ccl javascript -ccep "$POL" 2>&1 | tee "$GITHUB_WORKSPACE/out/deploy.log"
          if [ "${{ matrix.policy }}" != "org2and" ]; then
            export FABRIC_CFG_PATH=$PWD/../config/
            . scripts/envVar.sh
            setGlobals 3
            ls -la *.tar.gz | tee -a "$GITHUB_WORKSPACE/out/org3_lifecycle.log"
            peer lifecycle chaincode install bzt.tar.gz 2>&1 | tee -a "$GITHUB_WORKSPACE/out/org3_lifecycle.log"
            PKG=$(peer lifecycle chaincode calculatepackageid bzt.tar.gz)
            peer lifecycle chaincode approveformyorg -o localhost:7050 --ordererTLSHostnameOverride orderer.example.com --tls --cafile "$ORDERER_CA" \
              --channelID mychannel --name bzt --version 1.0 --package-id "$PKG" --sequence 1 --signature-policy "$POL" 2>&1 | tee -a "$GITHUB_WORKSPACE/out/org3_lifecycle.log"
            sleep 5
            peer lifecycle chaincode querycommitted --channelID mychannel --name bzt 2>&1 | tee -a "$GITHUB_WORKSPACE/out/org3_lifecycle.log"
          fi

      - name: Ledger write benchmark (${{ matrix.policy }})
        run: |
          cd e2e && npm install --no-audit --no-fund 2>&1 | tail -2
          export TN="$GITHUB_WORKSPACE/fabric-samples/test-network"
          node endorse.mjs ${{ matrix.policy }}-seq ../out/endorse_seq.json 200 1 1 2>&1 | tail -40 | tee ../out/endorse_seq.log
          node endorse.mjs ${{ matrix.policy }}-load ../out/endorse_load.json 500 32 4 2>&1 | tail -40 | tee ../out/endorse_load.log
          node run2.mjs ${{ matrix.policy }}-e2e ../out/e2e2_w2.json 150 16 2 2>&1 | tail -80 | tee ../out/e2e2_w2.log

      - name: Collect container logs
        if: always()
        run: |
          docker ps -a > out/docker_ps.txt 2>&1 || true
          for c in $(docker ps -a --format '{{.Names}}'); do docker logs --tail 200 "$c" > "out/container_$c.log" 2>&1 || true; done

      - name: Publish results to fabric-results branch
        if: always()
        run: |
          RUN="org3-run-${{ github.run_number }}-${{ matrix.policy }}-rep${{ matrix.rep }}"
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          for attempt in 1 2 3 4 5 6; do
            rm -rf res
            if git ls-remote --exit-code --heads "$URL" fabric-results >/dev/null 2>&1; then
              git clone -q --depth 1 --branch fabric-results "$URL" res
            else
              mkdir res && (cd res && git init -q -b fabric-results && git remote add origin "$URL")
            fi
            mkdir -p "res/$RUN"
            cp -r out/* "res/$RUN/" || true
            cd res
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Org3 endorsement results $RUN (job status: ${{ job.status }})" || true
            if git push origin fabric-results; then break; fi
            cd ..; sleep $((attempt * 5))
          done
