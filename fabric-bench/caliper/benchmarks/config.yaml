test:
  name: bzt-id-fabric
  description: BZT-ID credential issuance, verification and audit on real Hyperledger Fabric
  workers:
    number: 1
  rounds:
    - label: seed
      txNumber: 500
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 5
      workload:
        module: workload/bzt-workload.js
        arguments:
          op: seed
          contractId: bzt
          seedCount: 500
    - label: issue-10tps
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workload/bzt-workload.js
        arguments:
          op: issue
          contractId: bzt
          seedCount: 500
    - label: issue-25tps
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 25
      workload:
        module: workload/bzt-workload.js
        arguments:
          op: issue
          contractId: bzt
          seedCount: 500
    - label: issue-50tps
